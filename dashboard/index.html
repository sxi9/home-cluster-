<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>home-cluster</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --surface-2: #efeeea; --border: #dddcd6;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #8a8983;
  --accent: #2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --track: #e4e3de; --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232322; --border:#2e2e2c;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8d8c85; --accent:#3987e5;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --track:#2b2b29;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232322; --border:#2e2e2c;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8d8c85; --accent:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --track:#2b2b29;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
header h1 { font-size:20px; margin:0; letter-spacing:.2px; }
header h1 small { color:var(--text-3); font-weight:400; margin-left:8px; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); font-size:12px; color:var(--text-2); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--text-3); }
.dot.good { background:var(--good); } .dot.warn { background:var(--warn); } .dot.crit { background:var(--critical); }
.spacer { flex:1; }
button { font:inherit; color:var(--text-2); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:5px 10px; cursor:pointer; }
button:hover { color:var(--text); }

.tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
.tile { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
.tile .k { color:var(--text-3); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
.tile .v { font-size:28px; font-weight:600; margin-top:4px; font-variant-numeric: tabular-nums; }
.tile .v small { font-size:13px; color:var(--text-2); font-weight:400; margin-left:4px; }
.tile .sub { color:var(--text-2); font-size:12px; margin-top:2px; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.card h2 { font-size:13px; margin:0 0 12px; color:var(--text-2); text-transform:uppercase; letter-spacing:.6px; font-weight:600; }
.run { display:grid; grid-template-columns: 2fr 1fr; gap:16px; margin-bottom:16px; }
@media (max-width: 860px) { .run { grid-template-columns:1fr; } }
.model { font-size:16px; font-weight:600; word-break:break-all; }
.meta { color:var(--text-2); font-size:12px; margin-top:4px; }
.layers { display:flex; height:28px; border-radius:8px; overflow:hidden; background:var(--track); margin:14px 0 8px; gap:2px; }
.layers .seg { position:relative; min-width:4px; transition: width .3s; }
.layers .seg:hover { filter:brightness(1.12); }
.legend { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:12px; color:var(--text-2); }
.legend .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.legend b { color:var(--text); font-weight:600; }
.spark { width:100%; height:92px; display:block; margin-top:6px; }
.spark path.line { fill:none; stroke:var(--s1); stroke-width:2; stroke-linejoin:round; }
.spark path.area { fill:var(--s1); opacity:.12; }
.spark text { fill:var(--text-3); font-size:11px; }
.spark line { stroke:var(--border); }
.big { font-size:34px; font-weight:600; font-variant-numeric:tabular-nums; }
.big small { font-size:13px; color:var(--text-2); font-weight:400; margin-left:4px; }

.nodes { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:12px; }
.node { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; border-top:3px solid var(--accent); }
.node.asleep { opacity:.55; border-top-color: var(--text-3); }
.node .top { display:flex; align-items:center; gap:8px; }
.node .name { font-weight:600; font-size:15px; }
.node .badges { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 10px; }
.badge { font-size:11px; padding:2px 7px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-2); }
.badge.head { color:var(--accent); border-color:var(--accent); }
.bar { height:8px; background:var(--track); border-radius:4px; overflow:hidden; margin:4px 0 8px; }
.bar i { display:block; height:100%; border-radius:4px; background:var(--accent); }
.row { display:flex; justify-content:space-between; font-size:12px; color:var(--text-2); }
.row b { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
.kv { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:12px; color:var(--text-2); margin-top:6px; }
.kv b { color:var(--text); font-weight:500; }
.warnline { color:var(--serious); font-size:12px; margin-top:6px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
th { color:var(--text-3); font-weight:500; font-size:12px; }
td.num { font-variant-numeric:tabular-nums; text-align:right; }
.hidden { display:none; }
.empty { color:var(--text-3); padding:24px; text-align:center; }
.tip { position:fixed; pointer-events:none; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; color:var(--text-2); box-shadow:0 6px 24px rgba(0,0,0,.18); display:none; z-index:9; max-width:260px; }
.tip b { color:var(--text); }
footer { color:var(--text-3); font-size:12px; margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>home-cluster <small id="headname"></small></h1>
    <span class="pill"><span class="dot" id="statusdot"></span><span id="statustext">connecting</span></span>
    <span class="spacer"></span>
    <button id="viewbtn" title="Toggle between cards and a table">Table view</button>
    <button id="themebtn" title="Toggle dark / light">Theme</button>
  </header>

  <section class="tiles">
    <div class="tile"><div class="k">Generation</div><div class="v" id="t-gen">–<small>tok/s</small></div><div class="sub" id="t-gen-sub">no model running</div></div>
    <div class="tile"><div class="k">Prompt</div><div class="v" id="t-prompt">–<small>tok/s</small></div><div class="sub">prompt processing</div></div>
    <div class="tile"><div class="k">Pooled memory</div><div class="v" id="t-pool">–<small>GB</small></div><div class="sub" id="t-pool-sub">free on awake devices</div></div>
    <div class="tile"><div class="k">Devices</div><div class="v" id="t-nodes">–</div><div class="sub" id="t-nodes-sub">awake / known</div></div>
  </section>

  <section class="run">
    <div class="card">
      <h2>Current run</h2>
      <div id="run-empty" class="empty">No model running. On the head: <code>cluster run model.gguf</code></div>
      <div id="run-body" class="hidden">
        <div class="model" id="r-model"></div>
        <div class="meta" id="r-meta"></div>
        <div class="layers" id="r-layers"></div>
        <div class="legend" id="r-legend"></div>
      </div>
    </div>
    <div class="card">
      <h2>Tokens / second</h2>
      <div class="big" id="s-now">–<small>tok/s</small></div>
      <svg class="spark" id="spark" viewBox="0 0 400 92" preserveAspectRatio="none" role="img" aria-label="generation tokens per second, last two minutes"></svg>
      <div class="meta">last 2 minutes · <span id="s-max"></span></div>
    </div>
  </section>

  <section class="card">
    <h2>Devices</h2>
    <div class="nodes" id="nodes"></div>
    <div id="nodetable" class="hidden"></div>
  </section>

  <footer id="foot"></footer>
</div>
<div class="tip" id="tip"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
  const gb = (mb) => mb == null ? '–' : (mb / 1024).toFixed(mb >= 10240 ? 0 : 1);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const hist = [];           // tok/s samples
  let tableView = false;
  const tip = $('tip');

  // ---- theme toggle (persisted per viewer; everything else comes from the head)
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $('themebtn').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  };
  $('viewbtn').onclick = () => { tableView = !tableView; $('viewbtn').textContent = tableView ? 'Card view' : 'Table view'; render(last); };

  function showTip(ev, html) { tip.innerHTML = html; tip.style.display = 'block'; moveTip(ev); }
  function moveTip(ev) { tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 14) + 'px'; }
  function hideTip() { tip.style.display = 'none'; }

  // memory a node can offer to the model: GPU VRAM if it has dedicated VRAM, else free RAM capped by rpc --mem
  function offered(n) {
    const g = n.gpu || {};
    if (g.vram_free_mb != null && !g.unified) return g.vram_free_mb;
    const free = n.mem?.free_mb ?? 0;
    return n.rpc?.mem_mb ? Math.min(free, n.rpc.mem_mb) : free;
  }
  const isWarm = (n) => n.temp_c != null && n.temp_c >= 75;
  const isHot = (n) => n.temp_c != null && n.temp_c >= 85;

  function render(st) {
    if (!st) return;
    const nodes = st.nodes || [];
    const awake = nodes.filter(n => n.awake);
    const run = st.run, llama = st.llama, bench = st.bench || {};
    const measured = Object.entries(bench).filter(([k, v]) => v && v.tg_tps && nodes.some(n => n.name === k && n.awake));
    const slowest = measured.length > 1 ? measured.reduce((a, b) => (b[1].tg_tps < a[1].tg_tps ? b : a))[0] : null;
    $('headname').textContent = st.head || '';

    // status pill
    const running = run && run.status === 'running' && llama && llama.up;
    const dot = $('statusdot');
    dot.className = 'dot ' + (running ? 'good' : run && run.status === 'loading' ? 'warn' : run && run.status === 'failed' ? 'crit' : '');
    $('statustext').textContent = running ? 'serving ' + (run.model || '') : run && run.status === 'loading' ? 'loading model…' : run && run.status === 'failed' ? 'run failed' : 'idle';

    // tiles
    const gen = llama && llama.gen_tps != null ? llama.gen_tps : null;
    $('t-gen').innerHTML = (gen != null ? gen.toFixed(1) : '–') + '<small>tok/s</small>';
    $('t-gen-sub').textContent = running ? (llama.requests_processing || 0) + ' request(s) in flight' : 'no model running';
    $('t-prompt').innerHTML = (llama && llama.prompt_tps != null ? llama.prompt_tps.toFixed(0) : '–') + '<small>tok/s</small>';
    const pool = awake.filter(n => n.role === 'head' || n.rpc?.listening).reduce((a, n) => a + offered(n), 0);
    $('t-pool').innerHTML = gb(pool) + '<small>GB</small>';
    $('t-pool-sub').textContent = 'free on ' + awake.filter(n => n.role === 'head' || n.rpc?.listening).length + ' usable device(s)';
    $('t-nodes').textContent = awake.length + ' / ' + nodes.length;
    const hot = nodes.filter(isHot).length;
    $('t-nodes-sub').textContent = hot ? hot + ' device(s) running hot' : 'awake / known';

    // sparkline
    if (gen != null && gen > 0) hist.push(gen); else if (!run) hist.length = 0;   // the metric is an instantaneous rate, 0 when idle
    while (hist.length > 60) hist.shift();
    $('s-now').innerHTML = (gen != null ? gen.toFixed(1) : '–') + '<small>tok/s</small>';
    drawSpark(hist);

    // run panel
    if (run && run.devices && run.devices.length) {
      $('run-empty').classList.add('hidden'); $('run-body').classList.remove('hidden');
      $('r-model').textContent = run.model || '';
      $('r-meta').textContent = [run.size_mb ? gb(run.size_mb) + ' GB on disk' : null, run.n_layer ? run.n_layer + ' layers' : null,
        run.ngl != null && run.n_layer && run.ngl < run.n_layer ? (run.n_layer - run.ngl) + ' kept on head CPU' : null,
        run.ctx ? 'ctx ' + run.ctx : null, run.draft ? 'draft: ' + run.draft : null,
        run.tuning ? Object.entries(run.tuning).filter(([k, v]) => ['FLASH_ATTN','KV_CACHE_TYPE','MLOCK','NO_MMAP'].includes(k) && !['off','auto','f16'].includes(v)).map(([k, v]) => k.toLowerCase() + '=' + v).join(' ') || null : null,
        slowest && run.devices.some(d => d.node === slowest) ? 'bottleneck: ' + slowest : null, run.status, run.started ? 'started ' + new Date(run.started * 1000).toLocaleTimeString() : null].filter(Boolean).join(' · ');
      const total = run.devices.reduce((a, d) => a + (d.layers ? d.layers[1] - d.layers[0] : 0), 0) || 1;
      $('r-layers').innerHTML = run.devices.map((d, i) => {
        const n = d.layers ? d.layers[1] - d.layers[0] : 0;
        return `<div class="seg" style="width:${(100 * n / total).toFixed(2)}%;background:var(${SERIES[i % 8]})" data-i="${i}"></div>`;
      }).join('');
      $('r-legend').innerHTML = run.devices.map((d, i) => {
        const n = d.layers ? d.layers[1] - d.layers[0] : 0;
        return `<span><i class="sw" style="background:var(${SERIES[i % 8]})"></i><b>${esc(d.node || d.device)}</b> · ${n} layers${d.layers ? ' (' + d.layers[0] + '–' + (d.layers[1] - 1) + ')' : ''}${d.buffer_mb ? ' · ' + (d.buffer_estimated ? '~' : '') + gb(d.buffer_mb) + ' GB' : ''}</span>`;
      }).join('');
      [...$('r-layers').children].forEach(seg => {
        const d = run.devices[+seg.dataset.i];
        seg.onmousemove = (ev) => showTip(ev, `<b>${esc(d.node || d.device)}</b><br>${esc(d.device)}<br>${d.layers ? 'layers ' + d.layers[0] + '–' + (d.layers[1] - 1) : ''}${d.buffer_mb ? '<br>' + gb(d.buffer_mb) + ' GB of weights' : ''}${d.link ? '<br>link: ' + d.link : ''}`);
        seg.onmouseleave = hideTip;
      });
    } else {
      $('run-empty').classList.remove('hidden'); $('run-body').classList.add('hidden');
    }

    // nodes
    const held = {};
    if (run && run.devices) run.devices.forEach((d, i) => {   // a node can hold several slices (head GPU + head CPU)
      if (!d.node || !d.layers) return;
      const n = d.layers[1] - d.layers[0];
      if (held[d.node]) { held[d.node].count += n; } else { held[d.node] = { ...d, i, count: n }; }
    });
    $('nodes').classList.toggle('hidden', tableView);
    $('nodetable').classList.toggle('hidden', !tableView);
    if (tableView) {
      $('nodetable').innerHTML = `<table><thead><tr><th>Device</th><th>Role</th><th>Link</th><th>GPU</th><th class="num">Free RAM</th><th class="num">Offered</th><th class="num">Layers</th><th class="num">Speed</th><th>Processor</th><th>Storage</th><th class="num">Temp</th><th>rpc</th><th>Seen</th></tr></thead><tbody>` +
        nodes.map(n => `<tr><td>${esc(n.name)}<br><small style="color:var(--text-3)">${esc(n.model || '')}</small></td><td>${esc(n.role)}</td><td>${esc(n.link)}</td><td>${esc(n.gpu?.kind || 'cpu')}</td><td class="num">${gb(n.mem?.free_mb)} / ${gb(n.mem?.total_mb)} GB</td><td class="num">${gb(offered(n))} GB</td><td class="num">${held[n.name] ? held[n.name].count : '–'}</td><td class="num">${bench[n.name] && bench[n.name].tg_tps ? bench[n.name].tg_tps + ' tok/s' + (n.name === slowest ? ' 🐢' : '') : '–'}</td><td><small>${esc((n.cpu || {}).model || '')}</small></td><td><small>${(n.storage || []).map(s => esc(s.kind) + ' ' + esc(s.vendor || s.model || '') + ' ' + s.size_gb + ' GB').join('<br>')}</small></td><td class="num">${n.temp_c != null ? n.temp_c + ' °C' : '–'}</td><td>${n.role === 'head' ? 'local' : n.rpc?.listening ? 'up' : 'down'}</td><td>${n.awake ? 'now' : n.age_s + ' s ago'}</td></tr>`).join('') + '</tbody></table>';
      return;
    }
    $('nodes').innerHTML = nodes.map(n => {
      const h = held[n.name];
      const usedPct = n.mem?.total_mb ? 100 * (1 - (n.mem.free_mb / n.mem.total_mb)) : 0;
      const g = n.gpu || {};
      const vram = g.vram_total_mb != null && !g.unified;
      const warn = isHot(n) ? '🔥 running hot, expect throttling' : isWarm(n) ? 'warm' : (n.battery && !n.battery.charging && n.battery.percent < 20) ? 'battery low and not charging' : '';
      return `<div class="node ${n.awake ? '' : 'asleep'}" style="${h ? 'border-top-color: var(' + SERIES[h.i % 8] + ')' : ''}">
        <div class="top"><span class="dot ${n.awake ? (n.role === 'head' || n.rpc?.listening ? 'good' : 'warn') : ''}"></span><span class="name">${esc(n.name)}</span><span class="spacer"></span><span class="meta">${n.awake ? 'awake' : 'asleep · ' + n.age_s + ' s'}</span></div>
        <div class="badges">
          <span class="badge ${n.role === 'head' ? 'head' : ''}">${esc(n.role)}</span>
          <span class="badge">${esc(n.os)} · ${esc(n.arch)}</span>
          <span class="badge">${n.link === 'wired' ? '🔌 wired' : n.link === 'wifi' ? '📶 wi-fi' : esc(n.link)}</span>
          <span class="badge">${g.kind && g.kind !== 'cpu' ? '🎮 ' + esc(g.kind) + (g.name ? ' · ' + esc(g.name) : '') : 'cpu'}</span>
          ${h ? `<span class="badge" style="color:var(${SERIES[h.i % 8]});border-color:var(${SERIES[h.i % 8]})">${h.count} layers</span>` : ''}
          ${n.name === slowest ? `<span class="badge" style="color:var(--serious);border-color:var(--serious)">🐢 slowest</span>` : ''}
        </div>
        <div class="row"><span>RAM</span><b>${gb(n.mem?.free_mb)} free / ${gb(n.mem?.total_mb)} GB</b></div>
        <div class="bar"><i style="width:${usedPct.toFixed(0)}%"></i></div>
        ${vram ? `<div class="row"><span>VRAM</span><b>${gb(g.vram_free_mb)} free / ${gb(g.vram_total_mb)} GB</b></div><div class="bar"><i style="width:${(100 * (1 - g.vram_free_mb / g.vram_total_mb)).toFixed(0)}%;background:var(--s3)"></i></div>` : ''}
        <div class="kv">
          <span>offers <b>${gb(offered(n))} GB</b></span>
          <span>rpc <b>${n.role === 'head' ? 'local' : n.rpc?.listening ? 'up :' + n.rpc.port : 'down'}</b></span>
          <span>load <b>${n.load1 != null ? n.load1.toFixed(2) : '–'}</b> / ${n.cpus ?? '–'} cpu</span>
          <span>temp <b>${n.temp_c != null ? n.temp_c + ' °C' : '–'}</b></span>
          ${n.battery ? `<span>battery <b>${n.battery.percent}%${n.battery.charging ? ' ⚡' : ''}</b></span>` : ''}
          ${bench[n.name] && bench[n.name].tg_tps ? `<span>speed <b>${bench[n.name].tg_tps} tok/s</b></span>` : `<span class="meta">speed: run <code>cluster bench</code></span>`}
          ${bench[n.name] && bench[n.name].rtt_ms != null && n.role !== 'head' ? `<span>link <b>${bench[n.name].rtt_ms} ms${bench[n.name].bw_mbps ? ' · ' + bench[n.name].bw_mbps + ' Mb/s' : ''}</b></span>` : ''}
          <span>${esc(n.model || '')}</span>
        </div>
        ${hw(n)}
        ${procs(n)}
        ${(n.alerts || []).map(a => `<div class="warnline">⚠ ${esc(a)}</div>`).join('')}
        ${warn ? `<div class="warnline">${warn}</div>` : ''}
      </div>`;
    }).join('') || '<div class="empty">No devices have reported yet. Run worker.sh or android.sh on a device.</div>';
  }

  // hardware details: processor + every storage device (SSD/NVMe/HDD/eMMC/UFS/SD card) with vendor, size, free
  function hw(n) {
    const c = n.cpu || {};
    const cpu = c.model ? `${esc(c.model)}${c.cores ? ' · ' + c.cores + ' cores' : ''}${c.max_mhz ? ' · ' + (c.max_mhz / 1000).toFixed(1) + ' GHz' : ''}` : '';
    const st = (n.storage || []).map(s => `${esc(s.kind)}${s.vendor || s.model ? ' ' + esc([s.vendor, s.model].filter(Boolean).join(' ')) : ''} ${s.size_gb} GB${s.free_gb != null ? ' (' + s.free_gb + ' free)' : ''}`);
    if (!cpu && !st.length) return '';
    return `<div class="kv" style="grid-template-columns:1fr;margin-top:8px;border-top:1px solid var(--border);padding-top:8px">
      ${cpu ? `<span>cpu <b>${cpu}</b></span>` : ''}
      ${st.map(s => `<span>storage <b>${s}</b></span>`).join('')}
    </div>`;
  }

  // process manager: top processes (cluster's own ones dimmed), plus the ssh command to reach the device
  function procs(n) {
    const ps = n.processes || [];
    const sshc = n.ssh && n.lan_ip ? `ssh -p ${n.ssh.port} ${n.ssh.user}@${n.lan_ip}` : (n.os === 'windows' ? '' : '');
    if (!ps.length && !sshc) return '';
    return `<details style="margin-top:8px;border-top:1px solid var(--border);padding-top:6px">
      <summary style="cursor:pointer;color:var(--text-2);font-size:12px">processes${ps.length ? ' · top ' + ps.length : ''}${sshc ? ' · terminal' : ''}</summary>
      ${ps.length ? `<table style="margin-top:6px;font-size:12px"><tbody>${ps.slice(0, 6).map(p => `<tr style="${p.cluster ? 'opacity:.55' : ''}"><td style="padding:2px 6px 2px 0">${esc(p.name)}</td><td class="num" style="padding:2px 6px">${p.rss_mb >= 1024 ? (p.rss_mb / 1024).toFixed(1) + ' GB' : p.rss_mb + ' MB'}</td><td class="num" style="padding:2px 0 2px 6px">${p.cpu_pct != null ? p.cpu_pct + '%' : ''}</td></tr>`).join('')}</tbody></table>` : ''}
      ${sshc ? `<div class="meta" style="margin-top:6px">terminal: <code>cluster ssh ${esc(n.name)}</code> on the head, or <code>${esc(sshc)}</code></div>` : ''}
      <div class="meta">kill: <code>cluster kill ${esc(n.name)} PID</code></div>
    </details>`;
  }

  function drawSpark(h) {
    const svg = $('spark'); const W = 400, H = 92, pad = 6;
    if (h.length < 2) { svg.innerHTML = `<text x="8" y="50">waiting for samples…</text>`; $('s-max').textContent = ''; return; }
    const max = Math.max(...h, 1);
    const x = (i) => pad + (W - 2 * pad) * i / 59;
    const y = (v) => H - pad - (H - 2 * pad) * v / max;
    const start = 60 - h.length;
    const pts = h.map((v, i) => `${x(start + i).toFixed(1)},${y(v).toFixed(1)}`);
    const line = 'M' + pts.join(' L');
    const area = line + ` L${x(59).toFixed(1)},${H - pad} L${x(start).toFixed(1)},${H - pad} Z`;
    svg.innerHTML = `<line x1="${pad}" x2="${W - pad}" y1="${y(max).toFixed(1)}" y2="${y(max).toFixed(1)}" stroke-dasharray="3 4"/><path class="area" d="${area}"/><path class="line" d="${line}"/><text x="${pad + 2}" y="${(y(max) + 12).toFixed(1)}">${max.toFixed(1)}</text>`;
    $('s-max').textContent = 'peak ' + max.toFixed(1) + ' tok/s';
  }

  let last = null;
  async function tick() {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      last = await r.json();
      render(last);
      $('foot').textContent = 'updated ' + new Date().toLocaleTimeString() + ' · api: ' + location.origin + '/api/state' + (last.llama_url ? ' · llama-server: ' + last.llama_url : '');
    } catch (e) {
      $('statusdot').className = 'dot crit'; $('statustext').textContent = 'clusterd unreachable';
    }
  }
  document.addEventListener('mousemove', (e) => { if (tip.style.display === 'block') moveTip(e); });
  tick(); setInterval(tick, 2000);
})();
</script>
</body>
</html>
